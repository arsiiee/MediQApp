<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 726" width="340" height="726" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="340" height="726" fill="#FFFFFF"/>
  <rect x="2" y="2" width="336" height="652" rx="20" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <rect x="2" y="2" width="336" height="30" rx="20" fill="#FFFFFF"/>
  <text x="22" y="22" font-size="10" font-weight="bold" fill="#212121">9:41</text>
  <rect x="286" y="12" width="4" height="9" fill="#212121"/><rect x="293" y="9" width="4" height="12" fill="#212121"/><rect x="300" y="6" width="4" height="15" fill="#212121"/>
  <rect x="310" y="10" width="18" height="9" rx="2" fill="none" stroke="#212121" stroke-width="1.2"/><rect x="312" y="12" width="12" height="5" fill="#212121"/>

  <rect x="2" y="34" width="336" height="52" fill="#006B3C"/>
  <path d="M28,52 L16,60 L28,68" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="44" y="65" font-size="14" font-weight="bold" fill="#FFFFFF">Appointment</text>
  <rect x="252" y="48" width="72" height="24" rx="12" fill="#FFFFFF"/>
  <text x="288" y="64" font-size="10" font-weight="bold" fill="#2E7D32" text-anchor="middle">Confirmed</text>

  <rect x="16" y="100" width="308" height="70" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
  <circle cx="50" cy="135" r="20" fill="#E8F5E9"/>
  <text x="50" y="140" font-size="13" font-weight="bold" fill="#0F5132" text-anchor="middle">DR</text>
  <text x="80" y="130" font-size="13.5" font-weight="bold" fill="#212121">Dr. Ana Reyes</text>
  <text x="80" y="148" font-size="10.5" fill="#5F5F5F">Dermatology &#183; PRC DEMO-PRC-0001</text>

  <g font-size="9.5" fill="#5F5F5F">
    <text x="30" y="196">DATE</text><text x="30" y="216" font-size="12.5" font-weight="bold" fill="#212121">Tuesday, 10 November 2026</text>
    <text x="30" y="242">TIME</text><text x="30" y="262" font-size="12.5" font-weight="bold" fill="#212121">09:00 &#8211; 09:30</text>
    <text x="30" y="288">LOCATION</text><text x="30" y="308" font-size="11.5" fill="#212121">Main Bldg &#183; 3F &#183; Rm 312</text>
    <text x="212" y="196">FEE</text><text x="212" y="216" font-size="12.5" font-weight="bold" fill="#212121">&#8369;850.00</text>
    <text x="212" y="242">STATUS</text><text x="212" y="262" font-size="12.5" font-weight="bold" fill="#2E7D32">Confirmed</text>
    <text x="212" y="288">BOOKED ON</text><text x="212" y="308" font-size="12" fill="#212121">07 Oct 2026</text>
  </g>

  <rect x="16" y="326" width="308" height="72" rx="10" fill="#F5F5F5"/>
  <text x="30" y="348" font-size="10" font-weight="bold" fill="#5F5F5F">REASON FOR VISIT</text>
  <text x="30" y="368" font-size="11" fill="#212121">Itchy rash on both forearms for 3 days.</text>
  <text x="30" y="388" font-size="9" fill="#94A3B8">Returned only by this endpoint, never by the list.</text>

  <rect x="16" y="412" width="308" height="48" rx="24" fill="#FFFFFF" stroke="#006B3C" stroke-width="1.6"/>
  <text x="170" y="442" font-size="13" font-weight="bold" fill="#006B3C" text-anchor="middle">Request a reschedule</text>
  <rect x="16" y="470" width="308" height="48" rx="24" fill="#FFFFFF" stroke="#B00020" stroke-width="1.6"/>
  <text x="170" y="500" font-size="13" font-weight="bold" fill="#B00020" text-anchor="middle">Cancel this appointment</text>

  <rect x="16" y="530" width="308" height="66" rx="10" fill="#FFF8E6" stroke="#B25E00" stroke-width="1.2"/>
  <text x="30" y="550" font-size="10" font-weight="bold" fill="#B25E00">Why you may not see these buttons</text>
  <text x="30" y="567" font-size="9.5" fill="#7A4A00">They are driven by one rule &#8212; the status permits a change.</text>
  <text x="30" y="582" font-size="9.5" fill="#7A4A00">Cancelled, completed or declined shows no action at all, so</text>
  <text x="30" y="594" font-size="9.5" fill="#7A4A00">the app never offers an action the server would refuse.</text>

  <text x="170" y="626" font-size="9.5" fill="#94A3B8" text-anchor="middle">Cancelling frees the slot so another patient can take it.</text>

  <line x1="0" y1="662" x2="340" y2="662" stroke="#CBD5E1"/>
  <text x="10" y="680" font-size="9.5" fill="#475569">Fig. 6 &#8212; Appointment detail. Cancel deletes</text>
  <text x="10" y="694" font-size="9.5" fill="#475569">the slot_claims row, so the 09:00 becomes bookable</text>
  <text x="10" y="708" font-size="9.5" fill="#475569">again while the appointment is kept for history.</text>
</svg>
