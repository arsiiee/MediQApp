<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 726" width="340" height="726" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="340" height="726" fill="#FFFFFF"/>
  <rect x="2" y="2" width="336" height="652" rx="20" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <rect x="2" y="2" width="336" height="30" rx="20" fill="#FFFFFF"/>
  <text x="22" y="22" font-size="10" font-weight="bold" fill="#212121">9:41</text>
  <rect x="286" y="12" width="4" height="9" fill="#212121"/><rect x="293" y="9" width="4" height="12" fill="#212121"/><rect x="300" y="6" width="4" height="15" fill="#212121"/>
  <rect x="310" y="10" width="18" height="9" rx="2" fill="none" stroke="#212121" stroke-width="1.2"/><rect x="312" y="12" width="12" height="5" fill="#212121"/>

  <rect x="2" y="34" width="336" height="52" fill="#006B3C"/>
  <path d="M28,52 L16,60 L28,68" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="44" y="65" font-size="14" font-weight="bold" fill="#FFFFFF">Verify your number</text>

  <rect x="2" y="86" width="336" height="56" fill="#E8F5E9"/>
  <g>
    <circle cx="62" cy="104" r="9" fill="#006B3C"/><path d="M57,104 l3.5,3.5 L67,101" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="130" cy="104" r="9" fill="#006B3C"/><text x="130" y="108" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="198" cy="104" r="9" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.4"/><text x="198" y="108" font-size="10" fill="#5F5F5F" text-anchor="middle">3</text>
    <circle cx="266" cy="104" r="9" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.4"/><text x="266" y="108" font-size="10" fill="#5F5F5F" text-anchor="middle">4</text>
    <text x="62" y="131" font-size="8.5" fill="#0F5132" text-anchor="middle">Details</text>
    <text x="130" y="131" font-size="8.5" fill="#0F5132" text-anchor="middle">Verify</text>
    <text x="198" y="131" font-size="8.5" fill="#5F5F5F" text-anchor="middle">Login</text>
    <text x="266" y="131" font-size="8.5" fill="#5F5F5F" text-anchor="middle">Done</text>
  </g>

  <text x="24" y="176" font-size="11.5" fill="#212121">We sent a 6-digit code to</text>
  <text x="24" y="198" font-size="15" font-weight="bold" fill="#212121">+63 917 555 0142</text>
  <text x="24" y="220" font-size="10.5" fill="#5F5F5F">It expires in 4:32. Five wrong attempts locks this number.</text>

  <g font-size="17" font-weight="bold" text-anchor="middle">
    <rect x="30" y="238" width="40" height="52" rx="8" fill="#F5F5F5" stroke="#8A8A8A" stroke-width="1.2"/><text x="50" y="271" fill="#212121">4</text>
    <rect x="78" y="238" width="40" height="52" rx="8" fill="#F5F5F5" stroke="#8A8A8A" stroke-width="1.2"/><text x="98" y="271" fill="#212121">1</text>
    <rect x="126" y="238" width="40" height="52" rx="8" fill="#F5F5F5" stroke="#8A8A8A" stroke-width="1.2"/><text x="146" y="271" fill="#212121">9</text>
    <rect x="174" y="238" width="40" height="52" rx="8" fill="#E8F5E9" stroke="#006B3C" stroke-width="2"/><text x="194" y="272" fill="#94A3AF">&#8722;</text>
    <rect x="222" y="238" width="40" height="52" rx="8" fill="#F5F5F5" stroke="#8A8A8A" stroke-width="1.2"/>
    <rect x="270" y="238" width="40" height="52" rx="8" fill="#F5F5F5" stroke="#8A8A8A" stroke-width="1.2"/>
  </g>

  <text x="170" y="318" font-size="11" fill="#006B3C" text-anchor="middle">Resend code in 0:42</text>
  <text x="170" y="342" font-size="10.5" fill="#5F5F5F" text-anchor="middle">Wrong number?</text>

  <rect x="20" y="366" width="300" height="48" rx="24" fill="#006B3C"/>
  <text x="170" y="396" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Verify and continue</text>

  <rect x="20" y="432" width="300" height="86" rx="8" fill="#FFF8E6" stroke="#B25E00" stroke-width="1.2"/>
  <text x="32" y="452" font-size="10.5" font-weight="bold" fill="#B25E00">Build note</text>
  <text x="32" y="469" font-size="9.5" fill="#7A4A00">No SMS gateway is integrated yet, so the server</text>
  <text x="32" y="483" font-size="9.5" fill="#7A4A00">returns the code in the HTTP body</text>
  <text x="32" y="497" font-size="9.5" fill="#7A4A00">(AuthService.returnCodeToCaller = true).</text>
  <text x="32" y="511" font-size="9.5" fill="#7A4A00">Flipped to false before any real patient.</text>

  <text x="170" y="600" font-size="9.5" fill="#94A3B8" text-anchor="middle">One ViewModel is shared by all four steps,</text>
  <text x="170" y="614" font-size="9.5" fill="#94A3B8" text-anchor="middle">scoped to the registration nav graph.</text>

  <line x1="0" y1="662" x2="340" y2="662" stroke="#CBD5E1"/>
  <text x="10" y="680" font-size="9.5" fill="#475569">Fig. 2 &#8212; Registration, step 2 of 4. The</text>
  <text x="10" y="694" font-size="9.5" fill="#475569">registrationId returned here is the only proof</text>
  <text x="10" y="708" font-size="9.5" fill="#475569">the number was verified; step 4 cannot skip it.</text>
</svg>
