  <text x="310" y="298" font-size="11.5" fill="#212121" text-anchor="end">&#8369;0.00</text>
  <line x1="30" y1="304" x2="310" y2="304" stroke="#F0F0F0"/>

  <text x="20" y="330" font-size="10.5" font-weight="bold" fill="#212121">Reason for visit <tspan font-weight="normal" fill="#5F5F5F">(optional)</tspan></text>
  <rect x="16" y="338" width="308" height="56" rx="8" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.2"/>
  <text x="30" y="360" font-size="10.5" fill="#9CA3AF">Itchy rash on both forearms for 3 days</text>
  <text x="30" y="384" font-size="9" fill="#94A3B8">Only you and clinic staff can read this.</text>

