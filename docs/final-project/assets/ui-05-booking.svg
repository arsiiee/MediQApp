  <circle cx="46" cy="130" r="18" fill="#E8F5E9"/>
  <text x="46" y="135" font-size="12" font-weight="bold" fill="#0F5132" text-anchor="middle">DR</text>
  <text x="74" y="126" font-size="13" font-weight="bold" fill="#212121">Dr. Ana Reyes</text>
  <text x="74" y="143" font-size="10.5" fill="#5F5F5F">Dermatology</text>
  <line x1="30" y1="158" x2="310" y2="158" stroke="#E0E0E0"/>
  <text x="30" y="178" font-size="9.5" fill="#5F5F5F">DATE</text>
  <text x="30" y="196" font-size="12.5" font-weight="bold" fill="#212121">Tuesday, 10 November 2026</text>
  <text x="180" y="178" font-size="9.5" fill="#5F5F5F">TIME</text>
  <text x="180" y="196" font-size="12.5" font-weight="bold" fill="#212121">09:00 &#8211; 09:30</text>
  <text x="30" y="218" font-size="9.5" fill="#5F5F5F">LOCATION</text>
  <text x="30" y="236" font-size="12" fill="#212121">Main Building &#183; 3rd Floor &#183; Room 312</text>

  <rect x="16" y="262" width="308" height="46" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
  <text x="30" y="280" font-size="10" fill="#5F5F5F">Consultation fee</text>
  <text x="310" y="280" font-size="11.5" fill="#212121" text-anchor="end">&#8369;850.00</text>
