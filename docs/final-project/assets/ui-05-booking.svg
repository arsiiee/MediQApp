  <rect x="20" y="442" width="300" height="48" rx="24" fill="#006B3C"/>
  <text x="170" y="472" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Book appointment</text>

  <rect x="16" y="504" width="308" height="70" rx="10" fill="#E8F5E9" stroke="#006B3C" stroke-width="1"/>
  <text x="30" y="524" font-size="10.5" font-weight="bold" fill="#0F5132">Your slot is protected at the moment you tap.</text>
  <text x="30" y="541" font-size="9.5" fill="#0F5132">The write that reserves it and the appointment row</text>
