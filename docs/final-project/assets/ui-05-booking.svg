  <text x="30" y="569" font-size="9.5" fill="#0F5132">notification can never disagree.</text>

  <text x="170" y="612" font-size="9.5" fill="#94A3B8" text-anchor="middle">Book button disabled until the tick is set.</text>

  <line x1="0" y1="662" x2="340" y2="662" stroke="#CBD5E1"/>
  <text x="10" y="680" font-size="9.5" fill="#475569">Fig. 5 &#8212; Booking confirmation. A 409 from</text>
  <text x="10" y="694" font-size="9.5" fill="#475569">the server is shown as its own sentence, not as</text>
  <text x="10" y="708" font-size="9.5" fill="#475569">a generic &#8220;try again&#8221; on a slot that is already gone.</text>
