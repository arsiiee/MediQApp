version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mediq
      POSTGRES_USER: mediq
      POSTGRES_PASSWORD: mediq_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediq"]
      interval: 10s
      timeout: 5s
      retries: 5

  ktor-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8099:8099"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/mediq
      - DB_USER=mediq
      - DB_PASSWORD=mediq_dev_password
      - DB_DRIVER=org.postgresql.Driver
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=http://localhost:4200,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  hono-bff:
    build:
      context: ./mediqweb/mediqapp-api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - KTOR_BASE_URL=http://ktor-server:8099
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
    depends_on:
      ktor-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-fe:
    build:
      context: ./mediqweb/mediqweb-fe
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - hono-bff
    environment:
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8099}
      - BFF_BASE_URL=${BFF_BASE_URL:-http://localhost:3000}

volumes:
  postgres_data: