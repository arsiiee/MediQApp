ktor {
    deployment {
        port = 8099
        port = ${?PORT}
        host = "0.0.0.0"
    }
}

db {
    # Local development default: H2 in-memory. For production/Supabase, override
    # via environment variables (Ktor reads env vars as config keys):
    #   DB_URL=jdbc:postgresql://<pooler-host>:6543/postgres
    #   DB_USER=<project-ref>.postgres
    #   DB_PASSWORD=<pooler-password>
    #   DB_DRIVER=org.postgresql.Driver
    url = "jdbc:h2:mem:mediq;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    user = "sa"
    password = ""
    driver = "org.h2.Driver"
    pool {
        size = 10
        minIdle = 2
        connectionTimeout = 30000
        idleTimeout = 600000
        maxLifetime = 1800000
    }
}

jwt {
    secret = "mediq-dev-secret-change-in-production"
}

cors {
    origins = "http://localhost:4200,http://localhost:3000"
}
