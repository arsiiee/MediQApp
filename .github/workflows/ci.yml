name: CI

# Quality gates for every change. Nothing merges without passing.
# Android unit tests + lint live here; instrumented (emulator) tests are in
# android-emulator.yml because a booted AVD costs ~10 minutes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (JVM) build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make wrapper executable
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and run server tests
        run: ./gradlew :server:test :server:assemble --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: server/build/reports/tests/**
          retention-days: 7

  android:
    name: Android lint + unit tests + assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # compileSdk 37 is installed by AGP's own SDK downloader once licenses
      # are accepted, so the package name (android-37 vs android-37.0) does not
      # need to be hardcoded here.
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Make wrapper executable
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/androidTests/**
          retention-days: 7

  # No plugin to install: this reads the resolved dependency graph that Gradle
  # already computed and reports it to GitHub for the dependency graph.
  dependency-graph:
    name: Dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make wrapper executable
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate dependency submission
        uses: gradle/actions/dependency-submission@v4
