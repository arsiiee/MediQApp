name: CI

on:
  push:
    branches: [main, develop, backend/server]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  KOTLIN_VERSION: '2.2.10'

jobs:
  ktor-server:
    name: Ktor Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3
      - name: Build and test Ktor server
        working-directory: server
        run: ./gradlew build -x test
      - name: Run Ktor server tests
        working-directory: server
        run: ./gradlew test

  web-frontend:
    name: Web Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mediqweb/mediqweb-fe/package-lock.json
      - name: Install dependencies
        working-directory: mediqweb/mediqweb-fe
        run: npm ci
      - name: TypeScript type check
        working-directory: mediqweb/mediqweb-fe
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: TypeScript type check (spec)
        working-directory: mediqweb/mediqweb-fe
        run: npx tsc --noEmit -p tsconfig.spec.json
      - name: Run web tests
        working-directory: mediqweb/mediqweb-fe
        run: npx vitest run
      - name: Lint web frontend
        working-directory: mediqweb/mediqweb-fe
        run: npm run lint
      - name: Build web frontend
        working-directory: mediqweb/mediqweb-fe
        run: npm run build

  hono-api:
    name: Hono API (Web BFF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mediqweb/mediqapp-api/package-lock.json
      - name: Install dependencies
        working-directory: mediqweb/mediqapp-api
        run: npm ci
      - name: TypeScript type check
        working-directory: mediqweb/mediqapp-api
        run: npm run build

  android:
    name: Android App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3
      - name: Build Android debug APK
        working-directory: .
        run: ./gradlew :app:assembleDebug
      - name: Run Android tests
        working-directory: .
        run: ./gradlew :app:test

  openapi-validation:
    name: OpenAPI Spec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI spec
        run: |
          if command -v swagger-cli >/dev/null 2>&1; then
            swagger-cli validate server/src/main/resources/openapi/documentation.yaml
          else
            echo "swagger-cli not installed, skipping spec validation"
          fi
