name: MediQ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ktor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Run Ktor tests
        working-directory: server
        run: ./gradlew test
      - name: Build Ktor server
        working-directory: server
        run: ./gradlew build

  web-fe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chrome for headless tests
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list
          apt-get update && apt-get install -y google-chrome-stable
      - name: Install dependencies
        run: npm ci
        working-directory: mediqweb/mediqweb-fe
      - name: Run tests
        run: npm test
        working-directory: mediqweb/mediqweb-fe
      - name: Build
        run: npm run build
        working-directory: mediqweb/mediqweb-fe
      - name: Type check
        run: npx tsc --noEmit
        working-directory: mediqweb/mediqweb-fe
      - name: Generate TypeScript client from OpenAPI spec
        run: npm run generate:ts-client
        working-directory: mediqweb/mediqweb-fe

  hono-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: mediqweb/mediqapp-api
      - name: Run tests
        run: npm test
        working-directory: mediqweb/mediqapp-api
      - name: Type check
        run: npx tsc --noEmit
        working-directory: mediqweb/mediqapp-api

  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Run Android tests
        run: ./gradlew :app:test
      - name: Build Android debug APK
        run: ./gradlew :app:assembleDebug

  openapi-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI spec
        run: |
          npx @apidevtools/swagger-cli validate server/src/main/resources/openapi/documentation.yaml
      - name: Verify TypeScript client compiles
        run: npm run generate:ts-client && npx tsc --noEmit
        working-directory: mediqweb/mediqweb-fe