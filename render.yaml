# Render.com deployment configuration for MediQ
# Multi-surface healthcare app: Ktor backend (Java), Hono BFF (Node), PostgreSQL
#
# Connect this repo to Render, then create a "Blueprint" using this file.
# The Angular frontend (mediqweb/mediqweb-fe) is NOT in this blueprint because
# static-site is not supported here — deploy it separately (e.g., Render Static Site
# created manually in the dashboard, or another host).
#
# After creating services, set the cross-service env vars (CORS_ORIGINS, KTOR_BASE_URL)
# to the onrender.com URLs of the sibling services.

databases:
  - name: mediq-db
    databaseName: mediq
    user: mediq
    plan: starter
    # Provision a Render-managed PostgreSQL database. Alternative: use Supabase
    # (project already wired) and set DB_URL/DB_USER/DB_PASSWORD manually instead.

envGroups:
  - name: mediq-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
        # Min 256 bits. Auto-generated by Render. Shared by Ktor and Hono BFF for token validation.
        # Rotate periodically. Never commit.
      - key: COOKIE_SECRET
        generateValue: true
        # Used by Hono BFF to sign the refresh-token cookie.

services:
  # ------------------------------------------------------------------
  # 1. Ktor backend — Android-facing API (Java)
  # ------------------------------------------------------------------
  - type: web
    name: mediq-ktor-server
    env: java
    rootDir: server
    # Gradle wrapper was normalized to Unix line endings for Linux builds.
    buildCommand: ./gradlew installDist -x test --no-daemon
    startCommand: ./build/install/mediq-server/bin/mediq-server
    healthCheckPath: /health
    autoDeploy: true
    plan: starter
    envVars:
      - key: DB_URL
        sync: false
        # Production: jdbc:postgresql://<mediq-db internal host>:5432/mediq
        #   (copy from Render Dashboard → mediq-db → Connect → Internal connection string,
        #    then prefix with jdbc:)
        # Dev fallback: jdbc:h2:mem:mediq;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      - key: DB_USER
        fromDatabase:
          name: mediq-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mediq-db
          property: password
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: JWT_SECRET
        group: mediq-secrets
      - key: CORS_ORIGINS
        sync: false
        # Comma-separated allow-list, no wildcards in production.
        # Example: https://mediq-web-fe.onrender.com,https://mediq-hono-bff.onrender.com
        # Set this after the frontend and BFF services exist.
      # PORT is injected by Render automatically; MainKt.kt reads it as first priority.

  # ------------------------------------------------------------------
  # 2. Hono BFF — Web auth proxy + aggregations (Node)
  # ------------------------------------------------------------------
  - type: web
    name: mediq-hono-bff
    env: node
    rootDir: mediqweb/mediqapp-api
    buildCommand: npm install
    startCommand: npx tsx src/index.ts
    healthCheckPath: /health
    autoDeploy: true
    plan: starter
    envVars:
      # PORT is injected by Render automatically; Hono reads it via serve({ port: PORT }).
      - key: KTOR_BASE_URL
        sync: false
        # https://mediq-ktor-server.onrender.com — set after the Ktor service exists.
      - key: SUPABASE_URL
        sync: false
        # https://<project-ref>.supabase.co — from Supabase project settings.
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
        # Supabase anon / publishable key — from Supabase project settings.
      - key: COOKIE_SECRET
        group: mediq-secrets
      - key: NODE_ENV
        value: development
        # Keep devDependencies (tsx) installed at runtime. Do not set to production.
