# Render.com deployment configuration for MediQ
# Multi-surface healthcare app: Ktor backend (Java), Hono BFF (Node), PostgreSQL
#
# Connect this repo to Render, then create a "Blueprint" using this file.
# The Angular frontend (mediqweb/mediqweb-fe) is NOT in this blueprint because
# static-site is not supported here — deploy it separately (e.g., Render Static Site
# created manually in the dashboard, or another host).
#
# After creating services, set the cross-service env vars (CORS_ORIGINS, KTOR_BASE_URL)
# to the onrender.com URLs of the sibling services.

services:
  # ------------------------------------------------------------------
  # 1. Ktor backend — Android-facing API (Java)
  # ------------------------------------------------------------------
  - type: web
    name: mediq-ktor-server
    env: docker
    rootDir: server
    healthCheckPath: /health
    autoDeploy: true
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: KTOR_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
