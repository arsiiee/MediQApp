# Render.com deployment configuration for MediQ
# Multi-surface healthcare app: Ktor backend (Java), Hono BFF (Node), PostgreSQL
#
# Connect this repo to Render, then create a "Blueprint" using this file.
# The Angular frontend (mediqweb/mediqweb-fe) is NOT in this blueprint because
# static-site is not supported here — deploy it separately (e.g., Render Static Site
# created manually in the dashboard, or another host).
#
# After creating services, set the cross-service env vars (CORS_ORIGINS, KTOR_BASE_URL)
# to the onrender.com URLs of the sibling services.

services:
  # ------------------------------------------------------------------
  # 1. Ktor backend — Android-facing API (Java)
  # ------------------------------------------------------------------
  - type: web
    name: mediq-ktor-server
    env: docker
    rootDir: server
    healthCheckPath: /health
    autoDeploy: true
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: KTOR_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # ------------------------------------------------------------------
  # 2. Hono BFF — Web auth proxy + aggregations (Node)
  # ------------------------------------------------------------------
  - type: web
    name: mediq-hono-bff
    env: node
    rootDir: mediqweb/mediqapp-api
    buildCommand: npm install
    startCommand: npx tsx src/index.ts
    healthCheckPath: /health
    autoDeploy: true
    plan: starter
    envVars:
      # PORT is injected by Render automatically; Hono reads it via serve({ port: PORT }).
      - key: KTOR_BASE_URL
        sync: false
        # https://mediq-ktor-server.onrender.com — set after the Ktor service exists.
      - key: SUPABASE_URL
        sync: false
        # https://<project-ref>.supabase.co — from Supabase project settings.
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
        # Supabase anon / publishable key — from Supabase project settings.
      - key: COOKIE_SECRET
        generateValue: true
        # Auto-generated by Render. Used by Hono BFF to sign the refresh-token cookie.
      - key: NODE_ENV
        value: development
        # Keep devDependencies (tsx) installed at runtime. Do not set to production.
