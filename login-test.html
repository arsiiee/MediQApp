<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediQ Login Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
    h1 { font-size: 1.25rem; margin-bottom: 8px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 24px; background: #fafafa; }
    label { display: block; margin: 12px 0 6px; font-size: 0.9rem; color: #333; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    button { margin-top: 16px; width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 0.9rem; display: none; white-space: pre-wrap; }
    .ok { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .err { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    code { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>MediQ Login Test</h1>
  <div class="card">
    <form id="form">
      <label>Supabase URL</label>
      <input id="url" type="url" placeholder="https://YOUR_PROJECT.supabase.co" required />
      <label>Supabase anon/publishable key</label>
      <input id="key" type="text" placeholder="your-anon-or-publishable-key" required />
      <label>Email</label>
      <input id="email" type="email" required />
      <label>Password</label>
      <input id="password" type="password" required />
      <button type="submit" id="btn">Sign in</button>
    </form>
    <div id="status"></div>
    <p style="font-size: 0.8rem; color: #666; margin-top: 16px;">Provide credentials at runtime. Do not commit keys.</p>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const status = $('status');
    const btn = $('btn');

    function show(msg, type) {
      status.textContent = msg;
      status.className = type;
      status.style.display = 'block';
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      status.style.display = 'none';
      try {
        const { createClient } = supabase;
        const client = createClient($('url').value.trim(), $('key').value.trim());
        const { data, error } = await client.auth.signInWithPassword({
          email: $('email').value.trim(),
          password: $('password').value,
        });
        if (error) throw error;
        if (!data.session?.access_token) throw new Error('No session returned');

        const { data: roleData, error: roleError } = await client.rpc('mediq_current_role');
        if (roleError) throw roleError;
        const role = Array.isArray(roleData) ? roleData[0]?.mediq_current_role : roleData?.mediq_current_role;
        show(`Login OK\nUser: ${data.user?.email ?? ''}\nRole: ${role ?? ''}`, 'ok');
      } catch (err) {
        show(`Error: ${err?.message ?? String(err)}`, 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
